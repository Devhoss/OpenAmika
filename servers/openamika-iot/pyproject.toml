[project]
name = "openamika-iot"
version = "0.1.0"
description = "OpenAmika's first-party MCP server for Zigbee smart-home control via mosquitto + zigbee2mqtt"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2",
    "paho-mqtt>=2.0",
]

[project.scripts]
openamika-iot = "openamika_iot.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["openamika_iot"]
