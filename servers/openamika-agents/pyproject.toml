[project]
name = "openamika-agents"
version = "0.1.0"
description = "OpenAmika's bridge that exposes personal task agents (Hermes Agent, nanoMuse) as MCP tools"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27",
]

[project.scripts]
openamika-agents = "openamika_agents.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["openamika_agents", "openamika_agents.adapters"]
