name: tests

# The offline test suite (README → Tests): no GPU, no models, no keys. Replay tests that need MekaHime's archived
# corpora skip themselves; tests marked "live" need a running stack and are deselected.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            brain/requirements.txt
            requirements-dev.txt
      - name: Install the brain and test dependencies
        run: python -m pip install -r brain/requirements.txt -r requirements-dev.txt
      - name: Offline test suite
        # The runner's default TEMP is an 8.3 short path (C:\Users\RUNNER~1\...); the memory store resolves its
        # folder to the long name, so the tests that compare backup paths need a temp folder without short names.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python -B -m pytest tests -k "not live" -p no:cacheprovider -q
